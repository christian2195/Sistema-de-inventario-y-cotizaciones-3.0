<!-- inventario/templates/inventario/product_confirm_delete.html -->
{% extends 'inventario/base.html' %}

{% block title %}Confirmar Eliminación - Sistema de Inventario{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Confirmar Eliminación</h1>
<p class="text-lg text-gray-700 mb-6 text-center">¿Estás seguro de que quieres eliminar el producto "<span class="font-semibold text-red-600">{{ object.nombre }}</span>"?</p>

<form method="post" class="flex justify-center space-x-4">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
        Sí, Eliminar
    </button>
    <a href="{% url 'inventario:product_detail' object.pk %}" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
        Cancelar
    </a>
</form>
{% endblock %}
