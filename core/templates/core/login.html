{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | EMVEPRO</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fondo corporativo oscuro con gradiente */
            background-color: #0f172a; 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin: 15px;
        }
        .login-header {
            background: rgba(0,0,0,0.2);
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .login-body {
            padding: 2.5rem 2rem;
        }
        .input-group-text {
            background-color: rgba(255,255,255,0.02);
            border: 1px solid #475569;
            color: #94a3b8;
        }
        .form-control {
            background-color: rgba(255,255,255,0.02);
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background-color: rgba(255,255,255,0.05);
            border-color: #0ea5e9;
            color: #f8fafc;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #0284c7;
            border-color: #0284c7;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #0369a1;
            border-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-card animate__animated animate__zoomIn">
        <div class="login-header">
            <img src="{% static 'img/logo_emvepro.png' %}" alt="Logo EMVEPRO" height="65" class="mb-3 bg-white rounded p-2 shadow">
            <h4 class="text-white fw-bold mb-0" style="letter-spacing: 1px;">EMVEPRO C.A.</h4>
            <p class="text-secondary small mb-0 text-uppercase tracking-wider mt-1" style="font-size: 0.75rem;">División de Proyectos</p>
        </div>
        
        <div class="login-body">
            <form method="POST">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger py-2 small border-0 border-start border-danger border-4 bg-danger bg-opacity-10 text-danger fw-bold animate__animated animate__shakeX">
                    <i class="bi bi-shield-lock-fill me-2"></i> Credenciales incorrectas o usuario inactivo.
                </div>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Usuario de Red</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text border-end-0"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" class="form-control border-start-0" required autofocus placeholder="Ingrese su usuario">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Contraseña</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text border-end-0"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" required placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mt-2">
                    INGRESAR AL SISTEMA <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>
        </div>
        
        <div class="bg-dark text-center py-3 border-top border-secondary text-secondary" style="font-size: 0.7rem; background: rgba(0,0,0,0.3) !important;">
            Gerencia de Tecnología de la Información y Comunicación<br>
            Infraestructura Tecnológica &copy; 2026
        </div>
    </div>

</body>
</html>
