{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Iniciar Sesión | EMVEPRO{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 border-top border-primary border-4 rounded-3">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="text-primary"><i class="bi bi-box-seam-fill"></i> EMVEPRO</h2>
                    <p class="text-muted">Acceso al Panel Operativo</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-4 fw-bold">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                    </button>
                </form>
                
                {% if form.errors %}
                <div class="alert alert-danger mt-3 mb-0" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos.
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
